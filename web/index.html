<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="theme-color" content="#0c1220">
<meta name="color-scheme" content="dark">
<title>__TITLE__ · __SUB__</title>
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#0c1220; --bg-1:#111a2b; --bg-2:#18243a; --bg-3:#22314c; --bg-deep:#080d16;

  --blue:#4c9aff; --blue-deep:#1f6feb; --green:#6ee7a8; --green-2:#4fbd86; --amber:#e3b341; --red:#e5484d;
  --fs-xs:12px; --lh-xs:16px; --fs-sm:14px; --lh-sm:20px; --fs-base:16px; --lh-base:24px;
  --fs-lg:18px; --lh-lg:28px; --fs-xl:20px; --lh-xl:28px; --fs-2xl:24px; --lh-2xl:32px;
  --sp-50:4px; --sp-75:8px; --sp-100:12px; --sp-200:16px; --sp-300:24px; --sp-400:32px; --sp-800:80px;

}
html{color-scheme:dark;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:var(--fs-base)/var(--lh-base) "Manrope","Geist","Microsoft YaHei","PingFang SC",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:var(--sp-300);padding:var(--sp-200) var(--sp-300);background:var(--bg-1);border-bottom:1px solid var(--line)}
h1{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:600;letter-spacing:0}

.badge{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-3)}
.tabs{display:flex;gap:var(--sp-50);margin-left:auto;background:var(--bg);padding:var(--sp-50);border-radius:var(--r-md);border:1px solid var(--line)}
.tab{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;padding:var(--sp-75) var(--sp-300);border-radius:var(--r-sm);cursor:pointer;color:var(--ink-3);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.tab:hover{background:var(--bg-2);color:var(--ink)}
.tab:active{transform:scale(.98)}
.tab.on{background:var(--blue);color:#fff}
main{flex:1;display:flex;min-height:0}
aside{width:212px;flex:none;background:var(--bg-1);border-right:1px solid var(--line);overflow:auto;padding:var(--sp-100) var(--sp-75)}
.sect{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-4);letter-spacing:1px;margin:var(--sp-200) var(--sp-75) var(--sp-75)}
.cat{font-size:var(--fs-sm);line-height:var(--lh-sm);padding:var(--sp-100);border-radius:var(--r-md);cursor:pointer;color:var(--ink-3);display:flex;justify-content:space-between;gap:var(--sp-75);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.cat:hover{background:var(--bg-2);color:var(--ink)}
.cat:active{transform:scale(.98)}
.cat.on{background:var(--bg-2);color:var(--blue)}
.cat em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat b{font-weight:400;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-4)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:var(--sp-200);align-items:center;padding:var(--sp-100) var(--sp-200);background:var(--bg-1);border-bottom:1px solid var(--line)}
input{flex:1;max-width:440px;background:var(--bg);border:1px solid var(--bg-3);border-radius:var(--r-md);color:var(--ink);font-size:var(--fs-sm);line-height:var(--lh-sm);padding:var(--sp-75) var(--sp-100);outline:none;transition:border-color var(--dur) var(--ease)}
input:focus{border-color:var(--blue)}
.hint{color:var(--ink-4);font-size:var(--fs-xs);line-height:var(--lh-xs)}
.list{flex:1;overflow:auto;padding:var(--sp-75) var(--sp-100) var(--sp-800)}
.row{display:flex;align-items:center;gap:var(--sp-200);padding:var(--sp-100);border-radius:var(--r-md);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 48px;transition:background-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.row:hover{background:var(--bg-1)}
.row:active{transform:scale(.98)}
.row .num{width:38px;flex:none;color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-xs);line-height:var(--lh-xs);text-align:right}
.row .main{min-width:0;flex:1}
.row .n{font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:var(--sp-50)}
.row .side{flex:none;text-align:right;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ink-3);min-width:84px}

.row .nx .k{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-4)}
.row .nx .v{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:var(--sp-50)}
.row .nx .t{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--green-2);font-variant-numeric:tabular-nums;margin-top:var(--sp-50)}
.row .star{flex:none;width:24px;text-align:center;color:var(--bg-3);font-size:var(--fs-base);line-height:var(--lh-base);transition:color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.row .star:hover{transform:scale(1.12)}
.row .star.on{color:var(--amber)}
.bar2{height:2px;width:200px;max-width:45%;background:var(--bg-3);border-radius:1px;margin-top:var(--sp-75);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--blue);width:0}
.empty{color:var(--ink-3);padding:var(--sp-400) var(--sp-200);font-size:var(--fs-sm);line-height:var(--lh-sm);border:1px solid var(--line);border-radius:var(--r-lg);margin:var(--sp-300);background:var(--bg-1)}
.toast{position:fixed;left:50%;bottom:var(--sp-300);transform:translateX(-50%) translateY(8px);background:var(--blue);color:#fff;padding:var(--sp-100) var(--sp-300);border-radius:var(--r-full);font-size:var(--fs-sm);line-height:var(--lh-sm);opacity:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.epg{width:430px;flex:none;background:var(--bg-1);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.epg.on{display:flex}
.epg .hd{display:flex;align-items:center;gap:var(--sp-75);padding:var(--sp-100) var(--sp-200);border-bottom:1px solid var(--line)}
.epg .hd .n{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-base);line-height:var(--lh-base)}
.epg .hd .x{cursor:pointer;color:var(--ink-3);font-size:var(--fs-lg);line-height:var(--lh-lg);padding:0 var(--sp-50);transition:color var(--dur) var(--ease)}
.epg .hd .x:hover{color:var(--ink)}
.epg .body{flex:1;overflow:auto;padding:var(--sp-75)}
.p{padding:var(--sp-100);border-radius:var(--r-md);display:flex;gap:var(--sp-100);font-size:var(--fs-sm);line-height:var(--lh-sm);cursor:pointer;border-left:3px solid transparent;transition:background-color var(--dur) var(--ease)}
.p:hover{background:var(--bg-2)}
.p .t{color:var(--blue);width:100px;flex:none;font-variant-numeric:tabular-nums;font-size:var(--fs-xs);line-height:var(--lh-xs)}
.p .m{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfe6d2}
.p.fut .m{color:var(--green)}
.p.fut .t{color:var(--green-2)}
.p.now{background:#123a5e;border-left-color:var(--blue)}
.p.now .m{color:#fff;font-weight:600}
.p.now .t{color:#a9d2ff}
.p .dot{width:7px;height:7px;border-radius:var(--r-sm);background:var(--blue);flex:none;margin-top:var(--sp-75)}
.past .m{color:var(--ink-4)}
.past .t{color:var(--ink-4)}
.p.past{opacity:.7}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:var(--sp-200) var(--sp-100);align-content:start;padding:var(--sp-200) var(--sp-200) var(--sp-800)}
.card{cursor:pointer;min-width:0}
.card .poster{position:relative;aspect-ratio:2/3;border-radius:var(--r-lg);overflow:hidden;background:var(--bg-2);border:1px solid var(--line);transition:border-color var(--dur) var(--ease),transform var(--dur-layout) var(--ease)}
.card .poster img{width:100%;height:100%;object-fit:cover;display:block}
.card .poster .ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-4);font-size:var(--fs-xs)}
.card:hover .poster{border-color:var(--blue);transform:translateY(-2px)}
.card .cname{margin-top:var(--sp-100);font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cmeta{margin-top:var(--sp-50);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .star{position:absolute;right:var(--sp-75);top:var(--sp-75);width:24px;height:24px;line-height:24px;text-align:center;border-radius:var(--r-full);background:rgba(0,0,0,.72);color:var(--ink-3);font-size:var(--fs-sm)}
.card .star.on{color:var(--amber)}
.card .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;line-height:44px;text-align:center;border-radius:var(--r-full);background:rgba(76,154,255,.92);color:#fff;opacity:0;transition:opacity var(--dur) var(--ease);font-size:var(--fs-sm)}
.card:hover .play{opacity:1}
.cat.off{opacity:.5;cursor:not-allowed}
.cat.off:hover{background:none;color:var(--ink-3)}
.cat.par{font-weight:600;color:var(--ink-2)}
.cat.par.on{background:var(--bg-2);color:var(--blue)}
.cat .arw{display:inline-block;width:14px;font-style:normal;color:var(--blue);font-size:var(--fs-xs);vertical-align:1px}
.cat.sub{padding-left:28px;font-size:var(--fs-sm);color:var(--ink-3)}
.cat.sub:hover{background:var(--bg-2);color:var(--ink)}
.cat.sub.on{background:var(--bg-2);color:var(--blue)}
.cat.sub b{font-size:var(--fs-xs)}
.epg .lg{display:flex;gap:var(--sp-200);padding:var(--sp-75) var(--sp-200) var(--sp-50);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--ink-3);border-bottom:1px solid var(--line-soft)}
.epg .lg span{display:inline-flex;align-items:center;gap:var(--sp-75)}
.epg .lg i{width:9px;height:9px;border-radius:var(--r-sm);display:inline-block}
.epg .lg i.a{background:#123a5e;border-left:2px solid var(--blue)}
.epg .lg i.b{background:#0f2a1e;border-left:2px solid var(--green-2)}
.epg .lg i.c{background:var(--bg-2);border-left:2px solid var(--ink-4)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:60;padding:var(--sp-400) var(--sp-300)}
.dlg.on{display:flex;align-items:center;justify-content:center}
.dlg .box{width:min(880px,96vw);max-height:86vh;overflow:auto;background:var(--bg-1);border:1px solid var(--bg-3);border-radius:var(--r-xl)}
.dlg .pic{height:280px;background:var(--bg-deep) center/cover no-repeat;position:relative}
.dlg .pic .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.92))}
.dlg .pic .t1{position:absolute;left:var(--sp-300);right:var(--sp-300);bottom:var(--sp-200);font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:600;text-shadow:0 2px 12px #000}
.dlg .body{padding:var(--sp-200) var(--sp-300) var(--sp-300)}
.dlg .meta{color:var(--ink-3);font-size:var(--fs-sm);line-height:var(--lh-sm);margin-bottom:var(--sp-100)}
.dlg .tags{display:flex;gap:var(--sp-75);flex-wrap:wrap;margin-bottom:var(--sp-200)}
.dlg .tags span{background:var(--bg-2);color:var(--blue);border:1px solid var(--bg-3);border-radius:var(--r-sm);padding:var(--sp-50) var(--sp-100);font-size:var(--fs-sm);line-height:var(--lh-sm);cursor:pointer;transition:background-color var(--dur) var(--ease)}
.dlg .tags span:hover{background:var(--bg-3)}
.dlg .line{font-size:var(--fs-base);line-height:var(--lh-base);color:var(--ink-2);margin:var(--sp-75) 0}
.dlg .line b{color:var(--ink-3);font-weight:400}
.dlg .desc{font-size:var(--fs-base);line-height:var(--lh-base);color:var(--ink-2);margin-top:var(--sp-200)}
.dlg .desc .dlgWarn{margin-top:var(--sp-100);padding:var(--sp-75) var(--sp-100);border-radius:var(--r-md);border:1px solid var(--line);color:var(--ink);background:var(--bg-2)}
.dlg .acts{display:flex;gap:var(--sp-200);margin-top:var(--sp-300);padding-top:var(--sp-200);border-top:1px solid var(--line)}
.dlg .btn{background:var(--blue);color:#fff;border:0;border-radius:var(--r-md);padding:var(--sp-100) var(--sp-300);font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600;cursor:pointer;transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.dlg .btn:hover{background:#6aabff}
.dlg .btn:active{transform:scale(.98)}
.dlg .btn.ghost{background:var(--bg-2);color:var(--ink-2)}
.dlg .btn.ghost:hover{background:var(--bg-3)}
.dlg .x2{position:absolute;right:var(--sp-200);top:var(--sp-100);color:var(--ink-2);font-size:var(--fs-2xl);line-height:var(--lh-2xl);cursor:pointer;z-index:2;transition:color var(--dur) var(--ease)}
.dlg .x2:hover{color:#fff}
.agent{margin-left:var(--sp-100);background:var(--bg-2);border:1px solid var(--bg-3);color:var(--blue);border-radius:var(--r-md);padding:var(--sp-75) var(--sp-100);font-size:var(--fs-xs);line-height:var(--lh-xs);cursor:pointer;white-space:nowrap;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.agent:hover{background:var(--bg-3);color:#fff}
.agent:active{transform:scale(.98)}
.dlg .abox{width:min(760px,94vw);background:var(--bg-1);border:1px solid var(--bg-3);border-radius:var(--r-xl);padding:var(--sp-300);position:relative}
.dlg .abox h3{margin:0 0 var(--sp-75);font-size:var(--fs-xl);line-height:var(--lh-xl);color:var(--ink);font-weight:600}
.dlg .abox p{margin:0 0 var(--sp-200);font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ink-3)}

.dlg .abox .acts{display:flex;gap:var(--sp-200);margin-top:var(--sp-200)}
@media (max-width:1240px){
  aside{width:172px}
  .row .nx{width:232px}
  .epg{width:360px}
  .list.grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:var(--sp-200) var(--sp-75)}
}
@media (max-width:980px){
  header{padding:var(--sp-100) var(--sp-200);gap:var(--sp-100);flex-wrap:wrap;align-items:center}
  h1{font-size:var(--fs-lg);line-height:var(--lh-lg)}
  .badge{display:none}
  .tab{padding:var(--sp-75) var(--sp-200);font-size:var(--fs-sm)}
  aside{width:138px}
  .cat{font-size:var(--fs-sm);padding:var(--sp-75)}
  .row .nx{display:none}
  .row .n{font-size:var(--fs-base)}
  .list.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--sp-200) var(--sp-75);padding:var(--sp-100) var(--sp-200) var(--sp-800)}
  .card .cname{font-size:var(--fs-sm)}
  .epg{width:min(300px,52vw)}
  .dlg{padding:var(--sp-300) var(--sp-100)}
}
@media (max-width:760px){
  .bar .hint{display:none}
  .row .side{min-width:56px}
  .list.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .card .star{width:20px;height:20px;line-height:20px;font-size:var(--fs-xs)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0ms!important;animation-duration:0ms!important}
  .card:hover .poster,.btn:active,.tab:active,.cat:active,.row:active,.agent:active{transform:none}
}
/* 签址凭证失效提示（原生 dialog，不要再叠 role/aria-modal/焦点陷阱） */
#tokWarn{width:min(760px,94vw);max-height:86vh;margin:auto;padding:0;background:var(--bg-1);color:var(--ink);border:1px solid var(--bg-3);border-radius:var(--r-xl);overflow:auto}
#tokWarn::backdrop{background:rgba(0,0,0,.72);overflow:hidden;overscroll-behavior:contain}

#tokWarn[open]{display:flex;flex-direction:column}
.twHead{display:flex;align-items:center;gap:var(--sp-200);padding:var(--sp-200) var(--sp-300);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-1);z-index:1}
.twHead h2{font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:600;flex:1}
.twX{flex:none}
.twLead{padding:0 var(--sp-300);margin-top:var(--sp-200);color:var(--ink-3);font-size:var(--fs-sm);line-height:var(--lh-sm)}

.twActs{display:flex;gap:var(--sp-100);align-items:center;padding:var(--sp-200) var(--sp-300) var(--sp-300);position:sticky;bottom:0;background:var(--bg-1)}

.tw{position:relative;display:inline-flex}
.tip{position:absolute;left:0;right:0;top:calc(100% + var(--sp-50));text-align:center;color:var(--green);font-size:var(--fs-xs);line-height:var(--lh-xs);opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none}
</style>
</head><body>
<header>
  <h1>__TITLE__ <i>· __SUB__</i></h1>
  <div class="badge" id="st">连接中…</div>
  <div class="badge" id="ver" style="color:#4fbd86">界面 --</div>
  <div class="tabs"><div class="tab on" data-tab="live">直播</div><div class="tab" data-tab="vod">点播</div><div class="tab" data-tab="replay" id="tabReplay" style="display:none">回看</div></div>
  <div class="agent" id="agentBtn">接线路？复制给智能体的一句话</div>
</header>
<main>
  <aside id="cats"></aside>
  <section>
    <div class="bar"><input id="kw" placeholder="搜台名 / 节目 / 片名…"><span class="hint" id="cnt"></span><span class="hint">点海报看详情/简介再播</span></div>

    <textarea id="aTxt" readonly>请帮我把这个 IPTV 外壳装到你这台电脑上，再接上这台电脑所在的网络。

第 0 步先拿东西：如果这台电脑上已经有 IPTV 外壳的项目目录，就直接用；没有就从 https://kele551.github.io/iptv-shell/download/iptv-shell-Windows.zip 下载免安装包（这个地址连不上就换 https://github.com/kele551/iptv-shell/releases/latest/download/iptv-shell-Windows.zip），解压到 D:\Program Files\IPTV外壳（没有就新建这个目录；别解压到桌面），会得到一个 IPTV-Shell 文件夹，里面的 IPTV-Shell.exe 双击就能跑，这台电脑不用装 Python。

然后按这个顺序做：
① 跑 IPTV-Shell.exe probe（这个 exe 没有控制台窗口，输出会写到同一个文件夹里的「命令行输出.txt」；命令没返回就是还没跑完，返回后再打开那个文件读），把本机正在跑的服务、磁盘上的 m3u / m3u8 / xmltv 清单、已有的 IPTV 项目都列出来。这一步只是「找源」，别停下问我地址。
② 选一份能用的接进外壳：有清单就改 IPTV-Shell 文件夹里的 config.json，填 "provider": "m3u" 和 "m3u_path"（点播另填 "vod_m3u"）；包里只有 config.example.json，第一次运行会自动生成 config.json，没生成就把 config.example.json 复制一份改名。有服务才照 _internal\providers\转发示例.py 写适配器。
③ 跑 IPTV-Shell.exe check（命令返回后再看「命令行输出.txt」）。只有结论出「可以交」才算接好。check 会真的去拉视频分片、数播放器窗口，公网源分片太小或这台机器窗口检测受限时可能报 FAIL —— 遇到 FAIL 不要改成演示数据（mock）去凑「可以交」，更不要只说「成功了」；按原文把没过的项和卡点报给我。
④ 最后正常启动一次程序（双击 IPTV-Shell.exe；命令行里用 start "" IPTV-Shell.exe），确认台表能出来、点开能播，所以这步不能省。程序不会自动放桌面图标；要图标就自己右键 IPTV-Shell.exe → 发送到 → 桌面快捷方式。文件夹本身别放桌面。

播放只用这台电脑上装好的播放器（mpv / VLC / PotPlayer 任一，Yaoplayer 按 mpv 算），不要内嵌网页播放器，也不要开机自启；点台、换台只许一个播放器窗口，已经在放就复用那个窗口切台，别每点一个台就新开一个播放器。要是这台宽带没开通 IPTV、探路也找不到任何清单，就直接告诉我「这条网络没有可用源」，别编假数据、别拿演示数据糊弄我。

不要把步骤列给我，你自己在这台电脑上执行。最后把 check 的原始输出贴给我，不要只说「成功了」；没通过就说清哪一项没过、卡在哪。</textarea>

<script>
const $=id=>document.getElementById(id);
let tab='live', cat='', live=null, vod=[], vodCats=[], seen=[], vodType='全部', vodTypes={};
let rpDay=1, rpData=null, rpWant=null;
let vodBands={}, vodBand='', vodFk=false, vodTags=[], vodSort='', vodTag='';
let favLive=JSON.parse(localStorage.getItem('iptv.fav.live')||'[]');
let favVod=(()=>{try{const v=JSON.parse(localStorage.getItem('iptv.fav.vod')||'{}');
  return Array.isArray(v)?Object.fromEntries(v.map(k=>[k,''])):(v||{});}catch(e){return {};}})();
let recent=JSON.parse(localStorage.getItem('iptv.recent')||'[]');
function save(){localStorage.setItem('iptv.fav.live',JSON.stringify(favLive));
 localStorage.setItem('iptv.fav.vod',JSON.stringify(favVod));localStorage.setItem('iptv.recent',JSON.stringify(recent.slice(0,30)));}
function toast(t,err){const el=$('toast');el.textContent=t;el.className='toast on'+(err?' err':'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',2400);}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
async function openEpg(code,name){
  const p=$('epg');$('epgName').textContent=name+' · 今天节目单';
  $('epgBody').innerHTML='<div class="empty">读取中…</div>';p.classList.add('on');
  try{
    const info=await j('/epg?code='+code);
    const list=info.list||[];
    if(!list.length){$('epgBody').innerHTML='<div class="empty">这台今天没有节目单数据。</div>';return;}
    const now=new Date(),hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');
    const cur=hh+mm;
    const rows=list.map(x=>{
      const isNow = x.s && x.e && x.s<=cur && cur<x.e;
      const past = x.e && x.e<=cur;
      return '<div class="p'+(isNow?' now':(past?' past':' fut'))+'"><div class="t">'+esc(x.s)+'-'+esc(x.e)+'</div>'
        +'<div class="dot" style="'+(isNow?'':'background:transparent')+'"></div>'
        +'<div class="m">'+esc(x.n)+'</div></div>';
    });
    $('epgBody').innerHTML=rows.join('');
    $('epgBody').querySelectorAll('.p').forEach(r=>r.onclick=()=>play('/ch/'+code+'.m3u8',name));
    const el=$('epgBody').querySelector('.p.now');
    if(el) $('epgBody').scrollTop=Math.max(0,el.offsetTop-120);
    const btn=document.createElement('div');
    btn.className='p';btn.style.marginTop='6px';
    btn.innerHTML='<div class="t">▶</div><div class="m" style="color:var(--blue)">现在就看这台</div>';
    btn.onclick=()=>play('/ch/'+code+'.m3u8',name);
    $('epgBody').appendChild(btn);
  }catch(e){$('epgBody').innerHTML='<div class="empty">节目单读取失败。</div>';}
}
$('epgX').onclick=()=>$('epg').classList.remove('on');
// ---------------- 回看 / 时移（线路实现了 catchup 才出现） ----------------
const DAYS=[[1,'今天'],[2,'昨天'],[3,'前天'],[4,'3 天前'],[5,'4 天前'],[6,'5 天前'],[7,'6 天前']];
function drawDays(box){
  const h=document.createElement('div');h.className='sect';h.textContent='回看日期（窗口 6 天）';box.appendChild(h);
  DAYS.forEach(([d,label])=>{
    const el=document.createElement('div');
    el.className='cat'+(rpDay===d?' on':'');
    const n=(rpData&&rpData.day===d)?(rpData.channels||[]).length:'';
    el.innerHTML='<em>'+label+'</em><b>'+(n===''?'':n)+'</b>';
    el.onclick=()=>{if(rpDay===d)return;rpDay=d;rpData=null;drawCats();loadReplay();};
    box.appendChild(el);
  });
  if(rpData&&rpData.filtered){
    const tip=document.createElement('div');tip.className='sect';
    tip.style.whiteSpace='normal';tip.style.fontSize='var(--fs-xs)';
    tip.style.color='var(--ink-4)';tip.textContent='只列实测能回看的台；4K 台和部分频道只能直播，去「直播」看。';
    box.appendChild(tip);
  }
}
async function loadReplay(){
  $('st').textContent='回看：正在拉节目单…';
  $('cnt').textContent='读取中…';
  const box=$('list');box.classList.remove('grid');
  box.innerHTML='<div class="empty">正在拉这一天的节目单…</div>';
  try{rpData=await j('/api/epg.day.json?day='+rpDay);}
  catch(e){rpData={day:rpDay,channels:[],error:1};}
  const n=(rpData.channels||[]).length;
  $('st').textContent='回看 '+(rpData.date||'')+' · '+n+' 台有节目单';
  drawCats();drawList();
  if(rpWant){
    const ch=(rpData.channels||[]).find(x=>x.code===rpWant);rpWant=null;
    if(ch) openReplay(ch.code,ch.name);
  }
}
function drawReplayList(kw){
  const box=$('list');box.classList.remove('grid');
  if(!rpData){box.innerHTML='<div class="empty">正在拉这一天的节目单…</div>';return;}
  const list=(rpData.channels||[]).filter(c=>!kw||(c.name||'').toLowerCase().includes(kw));
  $('cnt').textContent='共 '+list.length+' 台 · '+(rpData.total||0)+' 条节目';
  box.innerHTML=list.length?list.map(c=>{
    const n=(c.programs||[]).length;
    return '<div class="row" data-r="'+c.code+'" data-name="'+esc(c.name)+'">'
      +'<div class="num">'+esc(c.num)+'</div>'
      +'<div class="main"><div class="n">'+esc(c.name)+'</div>'
      +'<div class="s">'+esc(c.group||'')+'　共 '+n+' 条节目 · 点开选集</div></div>'
      +'<div class="side"><div style="color:var(--blue)">回看 ›</div></div></div>';
  }).join(''):'<div class="empty">这一天没有可用的节目单。</div>';
  box.querySelectorAll('.row').forEach(r=>r.onclick=()=>openReplay(r.dataset.r,r.dataset.name));
}
function openReplay(code,name){
  const p=$('epg'),ch=(rpData&&(rpData.channels||[]).find(x=>x.code===code))||null;
  $('epgName').textContent=name+' · '+((rpData&&rpData.date)||'')+' 节目单';
  p.classList.add('on');
  if(!ch||!(ch.programs||[]).length){$('epgBody').innerHTML='<div class="empty">这台这一天没有节目单。</div>';return;}
  const now=Math.floor(Date.now()/1000), win=((rpData&&rpData.window_h)||144)*3600, oldest=now-win;
  const rows=ch.programs.map(x=>{
    const st=+x.ts_s, et=+x.ts_e, end=Math.min(et,now);
    let cls='fut',can=false,note='待播';
    if(st>now){}
    else if(et<=now){
      if(st>=oldest){cls='past';can=true;note='';}
      else{note='超 6 天';}
    }else{cls='now';can=true;note='';}
    return '<div class="p '+cls+'" data-s="'+st+'" data-e="'+end+'" data-can="'+(can?1:0)+'">'
      +'<div class="t">'+esc(x.s)+'-'+esc(x.e)+'</div>'
      +'<div class="dot" style="'+(cls==='now'?'':'background:transparent')+'"></div>'
      +'<div class="m">'+esc(x.title)+(note?' <i style="color:var(--ink-4);font-style:normal">'+note+'</i>':'')+'</div></div>';
  });
  $('epgBody').innerHTML=rows.join('');
  $('epgBody').querySelectorAll('.p').forEach(r=>{
    if(r.dataset.can!=='1'){r.style.opacity='.55';return;}
    r.onclick=()=>play('/catchup/'+code+'.m3u8?start='+r.dataset.s+'&end='+r.dataset.e,
      name+' · '+(rpData&&rpData.date||'')+' 回看');
  });
  const btn=document.createElement('div');btn.className='p';
  btn.innerHTML='<div class="t">▶</div><div class="m" style="color:var(--blue)">看直播</div>';
  btn.onclick=()=>play('/ch/'+code+'.m3u8',name);
  $('epgBody').appendChild(btn);
  const el=$('epgBody').querySelector('.p.now')||$('epgBody').querySelector('.p.past');
  if(el) $('epgBody').scrollTop=Math.max(0,el.offsetTop-80);
}
function play(path,title,key,kind){
  if(key){recent=recent.filter(r=>r.key!==key);recent.unshift({key,kind,title});save();}
  fetch('/play?u='+encodeURIComponent(path)+'&t='+encodeURIComponent(title||''))
   .then(r=>r.json()).then(d=>{
     if(d.ok){toast('正在播：'+title);return;}
     if(TOK_ERR_RE.test(d.err||'')){showTokenWarn(d.err);return;}
     toast('打不开：'+(d.err||''),true);
   })
   .catch(()=>toast('请求失败',true));
}
async function j(u){const r=await fetch(u);return r.json();}

/* ---------- 签址凭证（token）失效：页面主动弹提示，里面可直接复制给智能体 ---------- */
const TOK_ERR_RE=/retCode|接口拒绝|签址|没签出地址|token/i;
const TOK_SEEN='iptvTokWarnSeen';
function tokenErrOf(st){
  if(!st) return '';
  if(st.token_error) return String(st.token_error);
  if(st.error&&TOK_ERR_RE.test(String(st.error))) return String(st.error);
  return '';
}
async function showTokenWarn(err){
  const dlg=$('tokWarn');
  if(!dlg||dlg.open) return;
  $('tokWarnErr').textContent=err||'（没取到报错原文）';
  dlg.dataset.err=err||'';
  $('tokWarnText').textContent='正在取操作稿…';
  try{
    const r=await fetch('/api/token.help.txt');
    $('tokWarnText').textContent=(await r.text()).trim()||'（操作稿没取到，请直接找智能体要换 token 的操作稿）';
  }catch(e){
    $('tokWarnText').textContent='（操作稿没取到，请直接找智能体要换 token 的操作稿）';
  }
  dlg.showModal();
  $('tokWarnCopy').focus();
}
async function checkToken(){
  try{
    const st=await j('/status');
    const err=tokenErrOf(st);
    if(!err) return;
    if(localStorage.getItem(TOK_SEEN)===err) return;   // 同一条报错只烦用户一次
    showTokenWarn(err);
  }catch(e){}
}
function copyWarnText(){
  const target=$('tokWarnText');
  const text=(target.innerText||target.textContent||'').trim();
  if(!text) return Promise.resolve(false);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';
    document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}
let _tokTimer=0;
function tokReport(ok){
  const tip=$('tokWarnTip'),btn=$('tokWarnCopy');
  clearTimeout(_tokTimer);
  tip.textContent='';btn.removeAttribute('data-copied');btn.removeAttribute('data-failed');
  tip.style.opacity='0';
  void btn.offsetWidth;
  btn.setAttribute(ok?'data-copied':'data-failed','');
  requestAnimationFrame(()=>{tip.textContent=ok?'已复制':'复制失败，请手动全选';tip.style.opacity='1';});
  _tokTimer=setTimeout(()=>{tip.textContent='';tip.style.opacity='0';btn.removeAttribute('data-copied');btn.removeAttribute('data-failed');},2000);
}
if('CommandEvent' in window){
  document.addEventListener('command',e=>{
    if(e.command!=='--copy'||e.target!==$('tokWarnText')) return;
    copyWarnText().then(tokReport);
  },true);
}else{
  $('tokWarnCopy').addEventListener('click',()=>copyWarnText().then(tokReport));
}
$('tokWarnX').addEventListener('click',()=>$('tokWarn').close());
$('tokWarnClose').addEventListener('click',()=>$('tokWarn').close());
$('tokWarn').addEventListener('close',()=>{
  localStorage.setItem(TOK_SEEN,$('tokWarn').dataset.err||'');
});
setTimeout(checkToken,800);
setInterval(()=>{if(document.visibilityState==='visible') checkToken();},60000);

function pseudo(){
  const allVod=Object.values(vodTypes).reduce((a,b)=>a+b,0)||((vodPage&&vodPage.total)||0);
  const list=[{n:'全部',c:tab==='live'?(live?live.total:0):allVod}];
  if(tab==='live') list.push({n:'收藏',c:favLive.length}); else list.push({n:'收藏',c:Object.keys(favVod).length});
  list.push({n:'最近播放',c:Math.min(30,recent.filter(r=>r.kind===tab).length)});
  if(tab==='vod'){const k=k4Total(); if(k) list.push({n:'4K专区',c:k,kind:'4k'});}
  if(tab==='vod') list.push({n:'最新上线',c:allVod,kind:'new'});
  return list;
}
function k4Total(){let n=0;Object.values(vodBands||{}).forEach(d=>{n+=(d['4k']||0)});return n;}
// 左栏口径：一级只按类型（电影/电视剧/纪录/综艺/动漫/少儿），二级只按年份 + 4K。
// 上游那些「VIP影视（新）·全部电视剧」「纪录专区·地理中国」一律不进左栏，太乱。
const TYPE_ORDER=['电影','电视剧','纪录','综艺','动漫','少儿'];
const BANDS=[['2026','2026 年'],['2025','2025 年'],['2024','2024 年'],['old','2023 及更早']];
let openTypes={'电影':1,'电视剧':1};
function drawCats(){
  const box=$('cats');box.innerHTML='';
  if(tab==='replay'){ drawDays(box); return; }
  const ps=pseudo();
  ps.forEach(p=>{
    const d=document.createElement('div');
    const on = p.kind==='4k' ? (vodFk && vodType==='全部')
             : p.kind==='new' ? (vodSort==='up')
             : (cat==='@'+p.n && !vodFk && vodSort!=='up' && !vodTag);
    d.className='cat'+(on?' on':'');
    d.innerHTML='<em>'+esc(p.n)+'</em><b>'+p.c+'</b>';
    d.onclick=()=>{
      vodBand='';vodType='全部';vodTag='';
      if(p.kind==='4k'){vodFk=true;vodSort='';cat='@4K专区';}
      else if(p.kind==='new'){vodFk=false;vodSort='up';cat='@最新上线';}
      else{vodFk=false;vodSort='';cat='@'+p.n;}
      drawCats();if(tab==='vod')loadVodPage(true);else drawList();
    };
    box.appendChild(d);
  });
  if(tab==='vod'){
    const ht=document.createElement('div');ht.className='sect';ht.textContent='片库分类';box.appendChild(ht);
    const bands=vodBands||{};
    let types=Object.keys(bands).filter(t=>t!=='全部');
    // 「其他」只有零星几条，左栏不显示，免得又变乱
    types=types.filter(t=>t!=='其他'||(bands[t].all||0)>=20);
    types.sort((a,b)=>{
      const ia=TYPE_ORDER.indexOf(a),ib=TYPE_ORDER.indexOf(b);
      if(ia<0&&ib<0) return (bands[b].all||0)-(bands[a].all||0);
      if(ia<0) return 1; if(ib<0) return -1;
      return ia-ib;
    });
    types.forEach(t=>{
      const d=bands[t], open=!!openTypes[t];
      const par=document.createElement('div');
      par.className='cat par'+((vodType===t&&!vodFk&&!vodBand)?' on':'');
      par.innerHTML='<em><i class="arw">'+(open?'▾':'▸')+'</i>'+esc(t)+'</em><b>'+(d.all||0)+'</b>';
      par.onclick=()=>{
        if(vodType===t&&open&&!vodBand&&!vodFk) delete openTypes[t]; else openTypes[t]=1;
        vodType=t;vodBand='';vodFk=false;vodSort='';vodTag='';cat='@全部';drawCats();loadVodPage(true);
      };
      box.appendChild(par);
      if(!open) return;
      const kids=[['','全部']].concat(BANDS).filter(([k])=>!k||(d[k]||0)>0);
      if((d['4k']||0)>0) kids.push(['4k','4K 高清']);
      kids.forEach(([k,label])=>{
        const on = vodType===t && (k==='4k'?vodFk:(vodBand===k&&!vodFk));
        const c = k==='4k'?d['4k']:(k?(d[k]||0):d.all);
        const sub=document.createElement('div');
        sub.className='cat sub'+(on?' on':'');
        sub.innerHTML='<em>'+esc(label)+'</em><b>'+c+'</b>';
        sub.onclick=()=>{vodType=t;openTypes[t]=1;vodBand=(k==='4k'?'':k);vodFk=(k==='4k');vodSort='';vodTag='';cat='@全播';drawCats();loadVodPage(true);};
        box.appendChild(sub);
      });
    });
    // 题材标签：从上游 pgmSndClass 来的（悬疑/喜剧/动作…），比年份更好筛
    if((vodTags||[]).length){
      const ht2=document.createElement('div');ht2.className='sect';ht2.textContent='题材';box.appendChild(ht2);
      vodTags.forEach(t=>{
        const d2=document.createElement('div');
        d2.className='cat sub'+(vodTag===t.n?' on':'');
        d2.style.paddingLeft='12px';
        d2.innerHTML='<em>'+esc(t.n)+'</em><b>'+t.c+'</b>';
        d2.onclick=()=>{vodTag=(vodTag===t.n?'':t.n);vodType='全部';vodBand='';vodFk=false;vodSort='';cat='@题材';drawCats();loadVodPage(true);};
        box.appendChild(d2);
      });
    }
  } else {
    const h=document.createElement('div');h.className='sect';h.textContent='频道分组';box.appendChild(h);
    const list=(live?live.groups:[]).map(g=>({n:g.name,c:g.count}));
    list.forEach(g=>{
      const d=document.createElement('div');
      d.className='cat'+(cat===g.n?' on':'');
      d.innerHTML='<em>'+esc(g.n)+'</em><b>'+g.c+'</b>';
      d.onclick=()=>{cat=g.n;drawCats();drawList();};
      box.appendChild(d);
    });
  }
  if(!cat) cat='@全部';
}
function progress(c){
  if(!c.cur) return '';
  const s=c.cur_start,e=c.cur_end;
  if(!s||!e) return '';
  const to=mm=>{const h=+mm.slice(0,2),m=+mm.slice(2,4);return h*60+m;};
  const now=new Date();const n=now.getHours()*60+now.getMinutes();
  let a=to(s),b=to(e);if(b<a)b+=1440;
  let p=Math.max(0,Math.min(100,((n<a?n+1440:n)-a)/(b-a)*100));
  return '<div class="bar2"><i style="width:'+p.toFixed(1)+'%"></i></div>';
}
function drawList(){
  const kw=($('kw').value||'').trim().toLowerCase(), box=$('list');
  const rows=[];let n=0;
  if(tab==='replay'){ drawReplayList(kw); return; }
  if(tab==='live'){
    let items=[];
    (live?live.groups:[]).forEach(g=>{ if(cat!=='@全部'&&cat!=='@收藏'&&cat!=='@最近播放'&&g.name!==cat) return;
      g.items.forEach(c=>items.push(c));});
    if(cat==='@收藏') items=items.filter(c=>favLive.includes('live:'+c.code));
    if(cat==='@最近播放'){const ks=recent.filter(r=>r.kind==='live').map(r=>r.key);
      items=items.filter(c=>ks.includes('live:'+c.code)).sort((a,b)=>ks.indexOf('live:'+a.code)-ks.indexOf('live:'+b.code));}
    items.forEach(c=>{
      if(kw && !((c.name||'').toLowerCase().includes(kw)||(c.cur||'').toLowerCase().includes(kw))) return;
      n++;
      const fav=favLive.includes('live:'+c.code);
      rows.push('<div class="row" data-p="/ch/'+c.code+'.m3u8" data-t="'+esc(c.name)+'" data-k="live:'+c.code+'" data-kind="live">'
        +'<div class="num">'+esc(c.num)+'</div>'
        +'<div class="star'+(fav?' on':'')+'" data-f="live:'+c.code+'">'+(fav?'★':'☆')+'</div>'
        +'<div class="main"><div class="n">'+esc(c.name)+'</div>'
        +'<div class="s">'+(c.cur?esc(c.cur)+'　'+esc(c.cur_start||'')+'-'+esc(c.cur_end||''):'（暂无节目单）')+'</div>'+progress(c)+'</div>'
        +'<div class="nx">'+(c.next
            ? '<div class="k">接下来</div><div class="v">'+esc(c.next)+'</div><div class="t">'+esc(c.next_start||'')+'</div>'
            : '<div class="k">接下来</div><div class="v" style="color:var(--ink-4)">暂无</div>')+'</div>'
        +'<div class="side" data-e="'+c.code+'" data-name="'+esc(c.name)+'">'
        +'<div style="color:var(--blue)">节目单 ›</div></div></div>');
    });
  }else{
    loadVodPage(true);
    return;
  }
  $('cnt').textContent='共 '+n+' 项';
  box.classList.remove('grid');
  box.innerHTML = rows.length? rows.join('') : '<div class="empty">这一类暂时没有可播的内容。</div>';
  box.querySelectorAll('.row').forEach(r=>r.onclick=e=>{
    if(e.target.classList.contains('star')) return;
    const side=e.target.closest('.side');
    if(side && side.dataset.e){openEpg(side.dataset.e,side.dataset.name);return;}
    play(r.dataset.p,r.dataset.t,r.dataset.k,r.dataset.kind);
  });
  box.querySelectorAll('.star').forEach(s=>s.onclick=e=>{
    e.stopPropagation();const f=s.dataset.f,t=s.dataset.t||'';
    if(f.startsWith('live:')){const i=favLive.indexOf(f);if(i>=0)favLive.splice(i,1);else favLive.push(f);}
    else{if(favVod[f])delete favVod[f];else favVod[f]=t;}
    save();
    if(tab==='vod'){renderVod();drawCats();}else{drawList();drawCats();}
  });
}
let vodPage={items:[],total:0,offset:0,loading:false,search:''};
async function loadVodPage(reset){
  if(tab!=='vod') return;
  // cat 以 @ 开头的都是左栏虚拟项（全部/收藏/最近/4K专区），不当栏目名传给后端
  const virtual=(cat||'').charAt(0)==='@';
  const isFavOrRecent = cat==='@收藏' || cat==='@最近播放';
  if(!reset && vodPage.loading) return;
  if(reset){vodPage.items=[];vodPage.offset=0;vodPage.total=0;}
  if(!isFavOrRecent){
    vodPage.loading=true; $('cnt').textContent='正在取片库…';
    try{
      const kw=($('kw').value||'').trim();
      if(kw){
        // 输片名就搜门户全库（含专区/VIP），不是只在本地库里筛
        const s=await j('/api/vod.search?kw='+encodeURIComponent(kw)+'&limit=60');
        vodPage.search=kw;
        vodPage.total=s.total||0;
        vodPage.items=(s.items||[]);
        vodPage.offset=vodPage.items.length;
        $('st').textContent='全库搜索 '+vodPage.total+' 部';
      }else{
      vodPage.search='';
      const d=await j('/api/vod.items.json?cat='+encodeURIComponent(virtual?'':cat)
        +'&type='+encodeURIComponent(vodType)+'&yb='+encodeURIComponent(vodBand||'')
        +'&fk='+(vodFk?'1':'0')+'&sort='+encodeURIComponent(vodSort||'')
        +'&tg='+encodeURIComponent(vodTag||'')
        +'&kw=&offset='+vodPage.offset+'&limit=300');
      vodPage.total=d.total||0;
      vodPage.items=vodPage.items.concat(d.items||[]);
      vodPage.offset=vodPage.items.length;
      const parts=[];
      if(vodSort==='up') parts.push('最新上线');
      if(vodTag) parts.push('题材：'+vodTag);
      if(vodFk) parts.push('4K');
      if(vodType&&vodType!=='全部') parts.push(vodType);
      if(vodBand) parts.push(vodBand==='old'?'2023 及更早':vodBand+' 年');
      $('st').textContent=(parts.length?parts.join(' · ')+' ':'')+'共 '+vodPage.total+' 部';
      }
    }catch(e){}
    vodPage.loading=false;
  }
  renderVod();
}

    +'<div class="star'+(fav?' on':'')+'" data-f="'+key+'" data-t="'+esc(v.name)+'">'+(fav?'★':'☆')+'</div>'

    vodTag=s.dataset.tg;vodType='全部';vodBand='';vodFk=false;vodSort='';cat='@题材';
    d.classList.remove('on');drawCats();loadVodPage(true);
  });
  $('dlgDir').innerHTML=v.dir?('<b>导演　</b>'+esc(v.dir)):'';
  $('dlgAct').innerHTML=v.act?('<b>主演　</b>'+esc(v.act)):'';
  $('dlgDesc').textContent=v.desc||'（暂无简介）';
  const pic=v.still?'/poster?u='+encodeURIComponent(v.still)
            :(v.img?'/poster?u='+encodeURIComponent(v.img):'');
  $('dlgPic').style.backgroundImage=pic?('linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.92)),url("'+pic+'")'):'';
  $('dlgFav').textContent=(key&&favVod[key])?'★ 已收藏':'☆ 收藏';
  $('dlgPlay').onclick=()=>{d.classList.remove('on');play('/vod/'+v.pid+'/'+v.cid+'.m3u8',v.name,key,'vod');};
  // 先问一句这片源放不放得了：DRM 加密 / 私有编码的片子提前说明，别让用户等一个黑屏窗口
  (async()=>{
    let ck=null;
    try{ck=await j('/api/vod.check.json?pid='+encodeURIComponent(v.pid)+'&cid='+encodeURIComponent(v.cid));}catch(e){}
    if(!ck||ck.ok!==false||$('dlgName').textContent!==(v.name||'')) return;
    $('dlgDesc').innerHTML=esc(v.desc||'（暂无简介）')+'<div class="dlgWarn">⚠ '
      +esc(ck.msg||'这片源放不了')+'</div>';
    $('dlgPlay').textContent='✕ 这片源放不了';
    $('dlgPlay').onclick=()=>toast(ck.msg||'这片源放不了',true);
  })();
  $('dlgFav').onclick=()=>{
    if(!key) return;
    if(favVod[key]) delete favVod[key]; else favVod[key]=v.name||'';
    save();$('dlgFav').textContent=(favVod[key])?'★ 已收藏':'☆ 收藏';renderVod();drawCats();
  };
  d.classList.add('on');
}

function renderVod(){
  const box=$('list'), rows=[];
  vodMap={};
  box.classList.add('grid');
  if(cat==='@收藏'){
    Object.entries(favVod).forEach(([k,title])=>{
      const p=k.split(':');
      rows.push(vRow({pid:p[1],cid:p[2],name:title||'(收藏的片子)',cat:'',sub:'收藏'},k));
    });
    $('cnt').textContent='收藏 '+rows.length+' 部';
  }else if(cat==='@最近播放'){
    recent.filter(r=>r.kind==='vod').slice(0,30).forEach(r=>{
      const p=r.key.split(':');
      rows.push(vRow({pid:p[1],cid:p[2],name:r.title||'',cat:'',sub:'最近播放'},r.key));
    });
    $('cnt').textContent='最近 '+rows.length+' 部';
  }else{
    vodPage.items.forEach(v=>{vodMap['vod:'+v.pid+':'+v.cid]=v;rows.push(vRow(v,'vod:'+v.pid+':'+v.cid));});
    $('cnt').textContent = vodPage.search
      ? ('全库命中 '+rows.length+' 部（含机顶盒专区/VIP 内容，未订购的点开会提示无权限）')
      : ('已显示 '+rows.length+' / 共 '+vodPage.total+' 部（往下滚自动续）');
  }
  box.innerHTML = rows.length? rows.join('') : '<div class="empty">这一类暂时没有内容；片库刚启动时可能需要等十几秒。</div>';
  box.querySelectorAll('.card').forEach(r=>r.onclick=e=>{
    if(e.target.classList.contains('star')) return;
    openDetail(vodMap[r.dataset.k], r.dataset.k);
  });
  box.querySelectorAll('.star').forEach(s=>s.onclick=e=>{
    e.stopPropagation();const f=s.dataset.f,t=s.dataset.t||'';
    if(favVod[f])delete favVod[f];else favVod[f]=t;
    save();renderVod();drawCats();
  });
}
const listBox=$('list');
listBox.onscroll=()=>{
  if(tab!=='vod'||cat==='@收藏'||cat==='@最近播放'||vodPage.search) return;

async function loadTab(){
  if(tab==='live'){
    if(!live){live=await j('/api/live.json');}
    $('st').textContent='直播 '+live.total+' 台 · 节目单更新 '+live.updated;
  }else if(tab==='replay'){
    if(!rpData||rpData.day!==rpDay||rpData.error){await loadReplay();}
    else{drawCats();drawList();}
    return;
  }else{
    const caps=(window.TPL&&window.TPL.caps)||{};
    if(!caps.vod){
      drawCats();
      $('st').textContent='这条线路没有点播片库';
      $('cnt').textContent='点播 0 部';
      const box=$('list');box.classList.add('grid');
      box.innerHTML='<div class="empty">这条线路暂时没有点播内容。要让点播也能用，接入时补一份点播清单（config.json 填 vod_m3u），或让线路本身提供点播数据。</div>';
      return;
    }
    if(!vodCats.length){
      let n=0;
      while(!vodCats.length&&n<40){
        n++;
        $('st').textContent='片库读取中… 已等 '+((n-1)*3)+' 秒（本机首次整理约 1 分钟，之后秒开）';
        try{
          const m=await j('/api/vod.json');
          if(m.total){
            vodCats=Object.entries(m.groups||{}).map(([nn,c])=>({n:nn,c})).sort((a,b)=>b.c-a.c);
            vodTypes=m.types||{};
            vodBands=m.bands||{};
            vodTags=m.tags||[];
            break;
          }
          if(m.building===false){
            $('st').textContent='这条线路没有点播片库';
            $('cnt').textContent='点播 0 部';
            const box=$('list');box.classList.add('grid');
            box.innerHTML='<div class="empty">这条线路暂时没有点播内容。要让点播也能用，接入时补一份点播清单（config.json 填 vod_m3u），或让线路本身提供点播数据。</div>';
            return;
          }
        }catch(e){}
        await new Promise(r=>setTimeout(r,3000));
      }
      if(!vodCats.length){$('st').textContent='片库还没读出来，点"点播"重试一次';return;}
    }
    drawCats();
    await loadVodPage(true);
    return;
  }
  drawCats();drawList();
}
